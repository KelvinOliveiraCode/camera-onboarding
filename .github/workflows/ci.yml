name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Conferir encoding dos arquivos de texto
        run: python tools/verificar_encoding.py

      - name: Verificar que o pacote importa
        run: python -c "import onboarding; print('onboarding ok')"

      - name: Rodar testes com cobertura
        run: python -m pytest --cov=onboarding --cov-report=term-missing --cov-report=xml

      - name: Conferir cobertura minima
        run: python -m coverage report --fail-under=70

      - name: Prova de aceite
        run: python tools/verificar_aceite.py

      - name: O lote processa sem duplicar e sinaliza falha
        run: |
          Copy-Item dados/inventario-inicial.csv ci-inv.csv -Force
          python -m onboarding executar --faixa dados/faixa-alvo.yaml --inventario ci-inv.csv --log exemplos/log-onboarding.md
          if ($LASTEXITCODE -eq 0) {
            Write-Error "havendo camera com falha, o CLI deveria sair com 1"
            exit 1
          }
          Remove-Item ci-inv.csv -Force
          Write-Output "ok: falha sinalizada com codigo diferente de zero"

      - name: O log esta atualizado
        run: |
          git diff --exit-code -- exemplos/log-onboarding.md